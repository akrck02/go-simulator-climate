<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 374" width="880" height="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .warm { fill: #fff1e5; stroke: #fb8f44; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .dashed { stroke: #8c959f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .head { fill: #8c959f; }
    .grid { stroke: #d0d7de; stroke-width: 1; fill: none; }
    .on { fill: #0969da; } .on2 { fill: #bc4c00; }
    .pause { fill: #eaeef2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .warm { fill: #3d1d00; stroke: #db6d28; }
      .title { fill: #e6edf3; }
      .text, .label { fill: #9198a1; }
      .code { fill: #4493f8; }
      .arrow, .dashed { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .grid { stroke: #30363d; }
      .on { fill: #4493f8; } .on2 { fill: #f0883e; }
      .pause { fill: #21262d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="374" rx="12"/>
  <rect class="box" x="24" y="30" width="180" height="92" rx="10" stroke-width="1.2"/>
  <text class="code" x="114" y="56" text-anchor="middle">climate.yaml</text>
  <text class="title" x="114" y="80" text-anchor="middle">The rules file</text>
  <text class="text" x="114" y="102" text-anchor="middle">the climate and seasons rules</text>
  <rect class="box" x="24" y="150" width="180" height="92" rx="10" stroke-width="1.2"/>
  <text class="code" x="114" y="176" text-anchor="middle">relieve.json + .f32</text>
  <text class="title" x="114" y="200" text-anchor="middle">The relief</text>
  <text class="text" x="114" y="222" text-anchor="middle">heights, km east and north</text>
  <path class="arrow" d="M204,76 C228,76 228,120 252,120" marker-end="url(#arrow)"/>
  <path class="arrow" d="M204,196 C228,196 228,150 252,150" marker-end="url(#arrow)"/>
  <rect class="box" x="256" y="60" width="212" height="150" rx="10" stroke-width="1.2"/>
  <text class="code" x="362" y="88" text-anchor="middle">go-simulator</text>
  <text class="title" x="362" y="112" text-anchor="middle">The host</text>
  <text class="text" x="362" y="136" text-anchor="middle">keeps the world, moves</text>
  <text class="text" x="362" y="153" text-anchor="middle">the stage's clock, applies</text>
  <text class="text" x="362" y="170" text-anchor="middle">and forwards the changes</text>
  <path class="arrow" d="M468,110 H552" marker-end="url(#arrow)"/>
  <text class="label" x="510" y="100" text-anchor="middle">start, step</text>
  <path class="arrow" d="M552,160 H468" marker-end="url(#arrow)"/>
  <text class="label" x="510" y="178" text-anchor="middle">changes</text>
  <rect class="warm" x="556" y="24" width="300" height="222" rx="10" stroke-width="1.2"/>
  <text class="code" x="706" y="50" text-anchor="middle">go-simulator-climate</text>
  <text class="title" x="706" y="74" text-anchor="middle">The climate plugin</text>
  <rect class="accent" x="574" y="90" width="110" height="24" rx="6" stroke-width="1"/>
  <text class="code" x="629.0" y="106.5" text-anchor="middle">climate</text>
  <text class="text" x="694" y="100" text-anchor="start">once, at the start:</text>
  <text class="text" x="694" y="117" text-anchor="start">temperature, precipitation</text>
  <text class="text" x="694" y="134" text-anchor="start">and biome fields, and</text>
  <text class="text" x="694" y="151" text-anchor="start">the biomes event</text>
  <rect class="accent" x="574" y="172" width="110" height="24" rx="6" stroke-width="1"/>
  <text class="code" x="629.0" y="188.5" text-anchor="middle">seasons</text>
  <text class="text" x="694" y="182" text-anchor="start">every step: the snow</text>
  <text class="text" x="694" y="199" text-anchor="start">line and foliage tint</text>
  <text class="text" x="694" y="216" text-anchor="start">(the environment)</text>
  <path class="dashed" d="M330,210 C330,240 156,236 156,262" marker-end="url(#arrow)"/>
  <path class="dashed" d="M380,210 C380,236 440,236 440,262" marker-end="url(#arrow)"/>
  <path class="dashed" d="M430,210 V244 Q430,252 440,252 H714 Q724,252 724,262" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="266" width="264" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="156" y="292" text-anchor="middle">Without a window</text>
  <text class="text" x="156" y="314" text-anchor="middle">cmd/simulate saves the fields as</text>
  <text class="text" x="156" y="331" text-anchor="middle">grids, and the events</text>
  <rect class="box" x="308" y="266" width="264" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="440" y="292" text-anchor="middle">Other programs and plugins</text>
  <text class="text" x="440" y="314" text-anchor="middle">go-scene-builder reads the saved biome;</text>
  <text class="text" x="440" y="331" text-anchor="middle">the flora plugin reads the fields</text>
  <rect class="box" x="592" y="266" width="264" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="724" y="292" text-anchor="middle">In the viewer</text>
  <text class="text" x="724" y="314" text-anchor="middle">go-renderer draws snow on ground</text>
  <text class="text" x="724" y="331" text-anchor="middle">that faces up and tints foliage</text>
</svg>
